name: DeviceRank Automated Publisher

on:
  schedule:
    # 03:57 UTC = 09:27 IST; 12:57 UTC = 18:27 IST.
    # GitHub Actions schedules are UTC and may start a few minutes late under load.
    - cron: '57 3 * * *'
    - cron: '57 12 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Optional evergreen category (leave empty for balanced rotation)'
        required: false
        default: ''
        type: string
      topic_id:
        description: 'Optional exact topic ID from config/evergreen_topics.json'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as Draft (true) or Live (false)'
        required: true
        default: true
        type: boolean
      slot:
        description: 'Idempotency slot for a manual run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

concurrency:
  group: devicerank-publisher-execution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$GEMINI_API_KEY" ] || missing+=(GEMINI_API_KEY)
          [ -n "$BLOGGER_BLOG_ID" ] || missing+=(BLOGGER_BLOG_ID)
          [ -n "$BLOGGER_CLIENT_ID" ] || missing+=(BLOGGER_CLIENT_ID)
          [ -n "$BLOGGER_CLIENT_SECRET" ] || missing+=(BLOGGER_CLIENT_SECRET)
          [ -n "$BLOGGER_REFRESH_TOKEN" ] || missing+=(BLOGGER_REFRESH_TOKEN)
          [ -n "$UNSPLASH_ACCESS_KEY" ] || missing+=(UNSPLASH_ACCESS_KEY)
          if ((${#missing[@]})); then
            echo "::error title=Missing GitHub Actions secrets::Add these repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore History Database
        uses: actions/cache@v4
        with:
          path: data/history.db
          key: devicerank-db-${{ github.run_id }}
          restore-keys: |
            devicerank-db-

      - name: Run DeviceRank Evergreen Tutorial Publisher
        run: |
          TARGET_CAT="${{ github.event.inputs.category }}"
          TARGET_TOPIC="${{ github.event.inputs.topic_id }}"
          TARGET_SLOT="${{ github.event.inputs.slot }}"
          DRAFT_FLAG="--live"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "57 3 * * *") TARGET_SLOT="morning" ;;
              "57 12 * * *") TARGET_SLOT="evening" ;;
              *) TARGET_SLOT="auto" ;;
            esac
          fi
          TARGET_SLOT="${TARGET_SLOT:-auto}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.draft }}" != "false" ]; then
            DRAFT_FLAG="--draft"
          fi
          CMD_ARGS=(--publish "$DRAFT_FLAG" --no-save --slot "$TARGET_SLOT")
          if [ -n "$TARGET_CAT" ]; then
            CMD_ARGS+=(--category "$TARGET_CAT")
          fi
          if [ -n "$TARGET_TOPIC" ]; then
            CMD_ARGS+=(--topic-id "$TARGET_TOPIC")
          fi
          echo "Running evergreen tutorial publisher (Category: ${TARGET_CAT:-balanced}, Topic: ${TARGET_TOPIC:-next}, Slot: $TARGET_SLOT, Mode: $DRAFT_FLAG)"
          python -m src.main run-evergreen "${CMD_ARGS[@]}"
