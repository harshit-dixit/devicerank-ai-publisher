name: DeviceRank Automated Publisher

on:
  schedule:
    # Dependable 3x/day schedule with 2 attempts per slot (17 and 37 minutes past the hour):
    # Morning Slot: 00:17 and 00:37 UTC (~05:47 & 06:07 IST)
    # Midday Slot:  08:17 and 08:37 UTC (~13:47 & 14:07 IST)
    # Evening Slot: 16:17 and 16:37 UTC (~21:47 & 22:07 IST)
    - cron: '17,37 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing slot override'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - midday
          - evening
      category:
        description: 'Optional category filter (leave empty to aggregate all categories)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as Draft (true) or Live (false)'
        required: true
        default: true
        type: boolean
      story_count:
        description: 'Maximum stories in the combined digest (6-8)'
        required: true
        default: '8'
        type: string

concurrency:
  group: devicerank-publisher-execution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$GEMINI_API_KEY" ] || missing+=(GEMINI_API_KEY)
          [ -n "$BLOGGER_BLOG_ID" ] || missing+=(BLOGGER_BLOG_ID)
          [ -n "$BLOGGER_CLIENT_ID" ] || missing+=(BLOGGER_CLIENT_ID)
          [ -n "$BLOGGER_CLIENT_SECRET" ] || missing+=(BLOGGER_CLIENT_SECRET)
          [ -n "$BLOGGER_REFRESH_TOKEN" ] || missing+=(BLOGGER_REFRESH_TOKEN)
          if ((${#missing[@]})); then
            echo "::error title=Missing GitHub Actions secrets::Add these repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore History Database
        uses: actions/cache@v4
        with:
          path: data/history.db
          key: devicerank-db-${{ github.run_id }}
          restore-keys: |
            devicerank-db-

      - name: Run DeviceRank News Digest
        run: |
          STORY_COUNT="${{ github.event.inputs.story_count || '8' }}"
          TARGET_CAT="${{ github.event.inputs.category }}"
          TARGET_SLOT="${{ github.event.inputs.slot || 'auto' }}"
          DRAFT_FLAG="--live"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.draft }}" != "false" ]; then
            DRAFT_FLAG="--draft"
          fi
          CMD_ARGS=(--stories "$STORY_COUNT" "$DRAFT_FLAG" --slot "$TARGET_SLOT")
          if [ -n "$TARGET_CAT" ]; then
            CMD_ARGS+=(--category "$TARGET_CAT")
          fi
          echo "Running combined digest (Slot: $TARGET_SLOT, Stories: $STORY_COUNT, Mode: $DRAFT_FLAG)"
          python -m src.main run-digest "${CMD_ARGS[@]}"
