name: DeviceRank Automated Publisher

on:
  schedule:
    # One evergreen tutorial per day. The second trigger is a safe retry;
    # the daily run ID prevents duplicate Blogger posts.
    # 03:17 and 03:37 UTC are approximately 08:47 and 09:07 IST.
    - cron: '17,37 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Optional evergreen category (leave empty for balanced rotation)'
        required: false
        default: ''
        type: string
      topic_id:
        description: 'Optional exact topic ID from config/evergreen_topics.json'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as Draft (true) or Live (false)'
        required: true
        default: true
        type: boolean

concurrency:
  group: devicerank-publisher-execution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$GEMINI_API_KEY" ] || missing+=(GEMINI_API_KEY)
          [ -n "$BLOGGER_BLOG_ID" ] || missing+=(BLOGGER_BLOG_ID)
          [ -n "$BLOGGER_CLIENT_ID" ] || missing+=(BLOGGER_CLIENT_ID)
          [ -n "$BLOGGER_CLIENT_SECRET" ] || missing+=(BLOGGER_CLIENT_SECRET)
          [ -n "$BLOGGER_REFRESH_TOKEN" ] || missing+=(BLOGGER_REFRESH_TOKEN)
          if ((${#missing[@]})); then
            echo "::error title=Missing GitHub Actions secrets::Add these repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore History Database
        uses: actions/cache@v4
        with:
          path: data/history.db
          key: devicerank-db-${{ github.run_id }}
          restore-keys: |
            devicerank-db-

      - name: Run DeviceRank Evergreen Tutorial Publisher
        run: |
          TARGET_CAT="${{ github.event.inputs.category }}"
          TARGET_TOPIC="${{ github.event.inputs.topic_id }}"
          DRAFT_FLAG="--live"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.draft }}" != "false" ]; then
            DRAFT_FLAG="--draft"
          fi
          CMD_ARGS=(--publish "$DRAFT_FLAG" --no-save)
          if [ -n "$TARGET_CAT" ]; then
            CMD_ARGS+=(--category "$TARGET_CAT")
          fi
          if [ -n "$TARGET_TOPIC" ]; then
            CMD_ARGS+=(--topic-id "$TARGET_TOPIC")
          fi
          echo "Running evergreen tutorial publisher (Category: ${TARGET_CAT:-balanced}, Topic: ${TARGET_TOPIC:-next}, Mode: $DRAFT_FLAG)"
          python -m src.main run-evergreen "${CMD_ARGS[@]}"
