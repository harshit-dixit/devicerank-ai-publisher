name: DeviceRank Automated Publisher

on:
  schedule:
    # One combined digest every eight hours: 00:00, 08:00, and 16:00 UTC.
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Optional category filter (leave empty to aggregate all categories)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as Draft (true) or Live (false)'
        required: true
        default: true
        type: boolean
      story_count:
        description: 'Maximum stories in the combined digest (6-8)'
        required: true
        default: '8'
        type: string

concurrency:
  group: devicerank-publisher-execution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore History Database
        uses: actions/cache@v4
        with:
          path: data/history.db
          key: devicerank-db-${{ github.run_id }}
          restore-keys: |
            devicerank-db-

      - name: Run DeviceRank News Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          STORY_COUNT="${{ github.event.inputs.story_count || '8' }}"
          TARGET_CAT="${{ github.event.inputs.category }}"
          DRAFT_FLAG="--live"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.draft }}" != "false" ]; then
            DRAFT_FLAG="--draft"
          fi
          CATEGORY_ARGS=()
          if [ -n "$TARGET_CAT" ]; then
            CATEGORY_ARGS=(--category "$TARGET_CAT")
          fi
          echo "Running combined digest (Stories: $STORY_COUNT, Mode: $DRAFT_FLAG)"
          python -m src.main run-digest "${CATEGORY_ARGS[@]}" --stories "$STORY_COUNT" $DRAFT_FLAG
