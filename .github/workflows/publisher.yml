name: DeviceRank Automated Publisher

on:
  schedule:
    # Runs daily at 07:00 UTC (12:30 PM IST)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to publish (leave empty for all)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as Draft (true) or Live (false)'
        required: true
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore History Cache
        uses: actions/cache@v4
        with:
          path: data/history.db
          key: devicerank-history-${{ github.run_id }}
          restore-keys: |
            devicerank-history-

      - name: Run DeviceRank Publisher Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          DEFAULT_PUBLISH_STATUS: ${{ github.event.inputs.draft == 'false' && 'LIVE' || 'DRAFT' }}
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            python -m src.main run-pipeline --category "${{ github.event.inputs.category }}"
          else
            python -m src.main run-pipeline
          fi
